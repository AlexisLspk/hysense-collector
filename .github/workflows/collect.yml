name: Collect market data

on:
  # Main trigger: cron-job.org calls the GitHub API every 5 minutes (GitHub's own scheduler is often late)
  workflow_dispatch:
  # Backup in case the external trigger stops
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/collector/requirements.txt

      - run: pip install -r jobs/collector/requirements.txt

      # The HySense sentiment analyzer (TypeScript) runs under Node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jobs/sentiment/package-lock.json

      - run: npm ci --prefix jobs/sentiment --no-audit --no-fund

      - name: Run collector
        working-directory: jobs/collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collect.py
