name: Collect market data

on:
  # Main trigger: cron-job.org calls workflow_dispatch every hour at :07
  workflow_dispatch:
  # Sparse backup in case the main trigger stops; GitHub's scheduler is often late or skipped
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only used by the keepalive step below
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/collector/requirements.txt

      - run: pip install -r jobs/collector/requirements.txt

      # The HySense sentiment analyzer (TypeScript) runs under Node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jobs/sentiment/package-lock.json

      - run: npm ci --prefix jobs/sentiment --no-audit --no-fund

      - name: Run collector
        working-directory: jobs/collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python collect.py

      # GitHub disables schedules in repos without activity for 60 days; re-enabling resets that timer
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
